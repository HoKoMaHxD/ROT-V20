services:
  - type: worker
    name: arena-roulette-control
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm test
    startCommand: npm start
    disk:
      name: encrypted-accounts
      mountPath: /var/data/arena
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/arena
      - key: BOT_TOKEN
        sync: false
      - key: CONTROL_GUILD_ID
        sync: false
      - key: ROULETTE_CHANNEL_ID
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: CLAN_COLLECTION
        value: clans
      - key: SOLO_COLLECTION
        value: solos
